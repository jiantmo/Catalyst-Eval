- tag: groundedness
  metric: true
  assertions:
  - text: response is based on actual ERP data retrieved from the system rather than
      hallucinated or assumed information
    level: critical
  - text: all data points (numbers, dates, IDs, statuses) in the response can be traced
      back to MCP tool outputs
    level: critical
  - text: when data is unavailable or cannot be retrieved, the system explicitly states
      this rather than making up plausible-sounding information
    level: critical
  - text: response does not include speculative or inferred information beyond what
      the tool calls returned
    level: critical
- tag: task_completion
  metric: true
  assertions:
  - text: the system successfully completes the requested action (create, read, update,
      delete, or workflow action) when feasible
    level: critical
  - text: if the task cannot be completed, the system clearly explains why and what
      prerequisites or permissions are missing
    level: critical
  - text: for multi-step tasks, all necessary steps are executed in the correct sequence
    level: critical
  - text: the system provides confirmation of successful task completion with relevant
      identifiers (e.g., requisition number, voucher number)
    level: critical
- tag: tool_selection
  metric: true
  assertions:
  - text: the system calls the appropriate MCP tools for the task (e.g., using create_purchase_requisition
      tool for creation tasks, not read tools)
    level: critical
  - text: tool parameters are correctly populated based on user input (legal entity,
      item numbers, quantities, etc.)
    level: critical
  - text: the system does not make redundant or unnecessary tool calls
    level: critical
  - text: when multiple tools are needed, they are called in a logical dependency order
    level: critical
- tag: error_handling
  metric: true
  assertions:
  - text: when tool calls fail or return errors, the system surfaces the error information
      clearly to the user
    level: critical
  - text: the system does not proceed with dependent actions when prerequisite tool
      calls fail
    level: critical
  - text: error messages include actionable information to help the user resolve the
      issue
    level: critical
