- tag: structure
  metric: true
  assertions:
  - text: 'response presents the most relevant key information first: a concise summary
      that directly answers the question followed by detailed explanation only as
      needed to support the reasoning'
    level: critical
  - text: response is well-structured and organized (uses clear visual hierarchy via
      headings, paragraphs, lists, tables, etc... as appropriate)
    level: critical
  - text: if there are multiple records, response presents ERP data in appropriate
      tabular format when displaying multiple records, with clear column headers and
      consistent data formatting (e.g., currency, dates, customer IDs) multiple records,
      with clear column headers and consistent data formatting (e.g., currency, dates,
      customer IDs)
    level: critical
- tag: depth
  metric: true
  assertions:
  - text: response ensures coverage and sufficiently answers the user’s query by including
      all essential information. this should apply only when system responds back
      with concrete answer based on ERP data including absense of data, otherwise
      it should be considered failed.
    level: critical
  - text: 'response is transparent about gaps: If essential information is missing,
      clearly inform the user of the gap or highlight uncertainties'
    level: critical
  - text: every claim must map to a number, date, or source; approximate qualifiers
      are used if precise values are unknown
    level: critical
  - text: response avoids U.S.-centric bias when the user asks for global context
    level: critical
- tag: recency
  metric: true
  assertions:
  - text: response anchors time-sensitive data to specific dates/times (e.g., 'as
      of Nov 14') rather than using relative terms like 'currently' or 'today' which
      lose meaning over time
    level: critical
  - text: response includes the date of the source for news, reports, or market data
      to allow the user to judge currency
    level: critical
  - text: response aligns the recency of the data with the user's intent (e.g., using
      the latest available quote for 'current price' vs. historical data for trends)
    level: critical
- tag: citation
  metric: true
  assertions:
  - text: response includes source references to legal entity in ERP. In case the
      response is seeking a clarification, it is not a failure
    level: critical
  - text: Response includes source references to company entity in ERP. In case the
      response is seeking a clarification, it is not a failure
    level: critical
  - text: Individual customer or vendor related responses should reference a customer
      or vendor contract ID. In case the response is seeking a clarification, it is
      not a failure
    level: critical
  - text: Summary vendor or customer responses for queries crossing customer or vendor
      IDs should include source citation references to a page in the ERP.  In case
      the response is seeking a clarification, it is not a failure. Also if the response
      is not a summary, it is not a failure
    level: critical
