- tag: structure
  metric: true
  assertions:
  - text: 'response presents the most relevant key information first: a concise summary
      directly answering the question followed by detail only as needed'
    level: critical
  - text: response is well-structured and organized (uses clear hierarchy via headings,
      paragraphs, lists, tables, etc., as appropriate)
    level: critical
- tag: recency
  metric: true
  assertions:
  - text: response anchors time-sensitive data to specific dates/times (e.g., 'as
      of Nov 14') rather than relative terms like 'currently' or 'today'
    level: critical
  - text: response includes the date of the source for news, reports, or market data
    level: critical
  - text: response aligns the recency of the data with the user's intent (e.g., latest
      quote for 'current price' vs. historical data for trends)
    level: critical
- tag: financialperformance&financialhealth_depth
  metric: true
  assertions:
  - text: response includes key financial metrics (e.g., margins, revenue, income,
      EPS, EBITDA, ROE)
    level: critical
  - text: response includes period-over-period comparisons (e.g., YoY, QoQ, trend,
      growth rate)
    level: critical
  - text: response includes causal explanation (e.g., drivers of change, root causes,
      external influences)
    level: critical
- tag: geographic&governmentalinsights_depth
  metric: true
  assertions:
  - text: topics related to geographic performance should contain geographic segment
      analysis (e.g., performance by region, market exposure, regional growth differences)
    level: critical
  - text: topics related to geographic dynamics should contain identification of geographic-specific
      drivers of change such as regional demand shifts, regulatory or policy changes,
      local macroeconomic factors, geopolitical events, or government actions
    level: critical
  - text: topics involving geographic comparisons should contain material cross-region
      differences (e.g., regional outperformance or underperformance, localized risks
      or opportunities)
    level: critical
- tag: investor&fundinglandscape_depth
  metric: true
  assertions:
  - text: response contains company guidance and forecasts, expected future trends,
      strategic direction, and identified risks/opportunities
    level: critical
  - text: response includes key financial metrics (e.g., margins, revenue, income,
      EPS, EBITDA, ROE)
    level: critical
- tag: peers&competitivepositioning_depth
  metric: true
  assertions:
  - text: response includes peer/competitor comparisons (e.g., industry benchmarking,
      market share analysis)
    level: critical
- tag: product&serviceintelligence_depth
  metric: true
  assertions:
  - text: response contains product or service or business-unit information (e.g.,
      category performance, feature set, segment dynamics)
    level: critical
  - text: response includes period-over-period comparisons (e.g., YoY, QoQ, trend,
      growth rate)
    level: critical
