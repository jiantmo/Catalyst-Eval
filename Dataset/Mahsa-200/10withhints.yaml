- query: What percent of YTD expense is represented by the single largest invoice. Since the current date is March 3, 2026, YTD means from January 1, 2026 onwards. VendInvoiceJournalLines is the required oDataPath.
  assertions:
  - text: Largest invoice 4,200.00 divided by YTD 64,495.00 equals 6.5 percent
    level: critical

- query: What is the cumulative expense total through January 15, 2026. Expense means vendor expense invoices in USMF from Jan 1, 2026.
  assertions:
  - text: Expenses from Jan 1-15 total 8,000.00
    level: critical

- query: What is the cumulative Training expense variance between Jan 31 and Feb 28. To run a Trial Balance, go to LedgerTrialBalanceListPage form for company USMF, select the date range, and click Calculate Balances. Run trial balance from 1/1/2026 to 1/31/2026, filter 602200, confirm 5,070.00. Run trial balance from 1/1/2026 to 2/28/2026, filter 602200, confirm 15,095.00. Subtract to get the variance.
  assertions:
  - text: Training increased from 5,070.00 to 15,095.00 resulting in 10,025.00 increase entirely driven by February postings
    level: critical

- query: What is the variance in Training Expense between February 15 and February 28, 2026. To run a Trial Balance, go to LedgerTrialBalanceListPage form for company USMF, select the date range, and click Calculate Balances. Go to Trial balance from 2/1/2026 to 2/15/2026, calculate balances, filter 602200, note 5,825.00. Change dates to 2/16/2026 to 2/28/2026, calculate balances, filter 602200, note 4,200.00. Subtract to get the variance.
  assertions:
  - text: Training from Feb 16-28 equals 4,200.00 versus 5,825.00 from Feb 1-15 resulting in second half being 1,625.00 lower
    level: critical

- query: What is the total expense recorded between January 22 and January 31, 2026. Use LedgerTrialBalanceListPage form for company USMF.
  assertions:
  - text: Total expense from Jan 22-31 equals 11,250.00
    level: critical

- query: Which account experienced the largest single week-over-week increase in February. To run a Trial Balance, go to LedgerTrialBalanceListPage form for company USMF, select the date range, and click Calculate Balances. Run Trial balance from 2/1/2026 to 2/7/2026 and from 2/8/2026 to 2/14/2026, filter accounts and compare balances.
  assertions:
  - text: Week Feb 8-14 totals 10,525.00 versus Feb 1-7 totals 7,750.00 resulting in increase of 2,775.00 primarily driven by 601600 which increased 1,950.00 week over week
    level: critical

- query: What is the total January 2026 expense excluding the largest invoice. Open VendInvoiceJournal for company USMF.
  assertions:
  - text: Jan total 25,070.00 minus 3,200.00 equals 21,870.00
    level: critical

- query: What is the difference between first half January and first half February expenses. To run a Trial Balance, go to LedgerTrialBalanceListPage form for company USMF, select the date range, and click Calculate Balances. Run Trial balance for both periods and compare.
  assertions:
  - text: Jan 1-15 totals 8,000.00 and Feb 1-15 totals 18,275.00 so February is higher by 10,275.00
    level: critical

- query: How much of February expense was recorded before February 12 and what accounts drove it. To run a Trial Balance, go to LedgerTrialBalanceListPage form for company USMF, select the date range, and click Calculate Balances. Run Trial balance for Feb 1-11, break out by account, divide by Feb total, and return analysis.
  assertions:
  - text: Feb 1-11 totals 12,400.00 comprised of 7,200.00 Promotional, 3,100.00 Training, and 2,100.00 Insurance. This equals 31.5 percent of the full February total 39,425.00
    level: critical
